<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181c26"/>
      <stop offset="100%" stop-color="#0f1218"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Base App Tile -->
  <rect width="128" height="128" rx="28" fill="url(#bg)" stroke="#262b38" stroke-width="2"/>

  <!-- 2x2 Wordle Grid -->
  <!-- Top Left: W (Green / Correct) -->
  <rect x="18" y="18" width="42" height="42" rx="10" fill="url(#green)" filter="url(#shadow)"/>
  <text x="39" y="47" fill="#ffffff" font-size="24" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" text-anchor="middle">W</text>

  <!-- Top Right: O (Gold / Present) -->
  <rect x="68" y="18" width="42" height="42" rx="10" fill="url(#gold)" filter="url(#shadow)"/>
  <text x="89" y="47" fill="#ffffff" font-size="24" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" text-anchor="middle">O</text>

  <!-- Bottom Left: R (Sky Blue / High-Contrast Present) -->
  <rect x="18" y="68" width="42" height="42" rx="10" fill="url(#blue)" filter="url(#shadow)"/>
  <text x="39" y="97" fill="#ffffff" font-size="24" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" text-anchor="middle">R</text>

  <!-- Bottom Right: D (Dark Slate / Absent) -->
  <rect x="68" y="68" width="42" height="42" rx="10" fill="#222735" stroke="#333a4c" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="89" y="97" fill="#9ca3af" font-size="24" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" text-anchor="middle">D</text>
</svg>
